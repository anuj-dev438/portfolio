<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 1300px;
      margin: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .search-box {
      width: 50%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
    }

    .search-box:focus { border-color: #aaa; }

    .buttons {
      display: flex;
      gap: 12px;
    }

    button {
      border: none;
      color: white;
      padding: 9px 15px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .add-btn { background: #198754; }
    .refresh-btn { background: #0d6efd; }

    .table-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      background: #212529;
      color: white;
      text-align: left;
      padding: 11px 8px;
      font-size: 15px;
    }

    td {
      border: 1px solid #ddd;
      padding: 9px 8px;
      font-size: 15px;
      height: 47px;
      word-break: break-word;
    }

    th:nth-child(1) { width: 9%; }
    th:nth-child(2) { width: 13%; }
    th:nth-child(3) { width: 13%; }
    th:nth-child(4) { width: 23%; }
    th:nth-child(5) { width: 12%; }
    th:nth-child(6) { width: 9%; }
    th:nth-child(7) { width: 21%; }

    .profile-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .action-btn {
      padding: 7px 10px;
      margin-right: 3px;
      margin-bottom: 3px;
      font-size: 14px;
      border-radius: 5px;
    }

    .view { background: #0dcaf0; color: #000; }
    .edit { background: #ffc107; color: #000; }
    .delete { background: #dc3545; }
    .save { background: #198754; }
    .cancel { background: #6c757d; }

    td input,
    td select {
      width: 100%;
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    .profile-input { padding: 3px !important; }

    .empty-row {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #555;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-dialog {
      width: 100%;
      max-width: 500px;
      margin: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #dee2e6;
    }

    .modal-title {
      margin: 0;
      font-size: 20px;
    }

    .modal-close {
      background: transparent;
      color: #333;
      font-size: 28px;
      padding: 0;
      line-height: 1;
    }

    .modal-body { padding: 20px; }

    .modal-body p { margin: 12px 0; }

    .view-profile {
      display: block;
      margin: 0 auto 20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }

    .message {
      display: none;
      padding: 10px 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      background: #f8d7da;
      color: #842029;
    }

    .message.show { display: block; }

    @media (max-width: 768px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box { width: 100%; }

      .buttons { justify-content: flex-end; }

      table { min-width: 900px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="top-bar">
      <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search by name"
      >

      <div class="buttons">
        <button class="add-btn" id="addStudent">Add Student</button>
        <button class="refresh-btn" id="refreshBtn">Refresh</button>
      </div>
    </div>

    <div id="message" class="message"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Profile</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Gender</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="studentTable"></tbody>
      </table>
    </div>
  </div>

  <!-- View Student Modal -->
  <div class="modal" id="viewStudentModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Student Details</h5>
          <button type="button" class="modal-close" id="closeViewModal">&times;</button>
        </div>

        <div class="modal-body">
          <img id="viewProfilePic" class="view-profile" alt="Profile">

          <p><strong>Name:</strong> <span id="viewName"></span></p>
          <p><strong>Email:</strong> <span id="viewEmail"></span></p>
          <p><strong>Phone:</strong> <span id="viewPhone"></span></p>
          <p><strong>Gender:</strong> <span id="viewGender"></span></p>
        </div>

      </div>
    </div>
  </div>

  <script>
    const apiUrl = "http://localhost:3000/api/students";
    const uploadUrl = "http://localhost:3000/uploads/";

    const studentTable = document.getElementById("studentTable");
    const searchInput = document.getElementById("searchInput");
    const addStudentBtn = document.getElementById("addStudent");
    const refreshBtn = document.getElementById("refreshBtn");
    const messageBox = document.getElementById("message");

    let searchTimer = null;

    function showMessage(message) {
      messageBox.textContent = message;
      messageBox.classList.add("show");

      setTimeout(() => {
        messageBox.classList.remove("show");
      }, 3000);
    }

    function getProfileUrl(profilePic) {
      if (!profilePic) {
        return "";
      }

      if (profilePic.startsWith("http://") || profilePic.startsWith("https://")) {
        return profilePic;
      }

      return uploadUrl + profilePic;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // GET ALL STUDENTS
    async function fetchStudents(search = "") {
      studentTable.innerHTML =
        '<tr><td colspan="7" class="loading">Loading...</td></tr>';

      try {
        const url = search.trim()
          ? `${apiUrl}?search=${encodeURIComponent(search.trim())}`
          : apiUrl;

        const res = await fetch(url);

        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }

        const data = await res.json();

        // Handles both direct array and {students: []} response
        const students = Array.isArray(data)
          ? data
          : Array.isArray(data.students)
            ? data.students
            : Array.isArray(data.data)
              ? data.data
              : [];

        renderStudents(students);
      } catch (error) {
        console.error("Fetch Error:", error);
        studentTable.innerHTML =
          '<tr><td colspan="7" class="empty-row">Unable to load students.</td></tr>';

        showMessage("Backend/API se students fetch nahi ho paaye.");
      }
    }

    function renderStudents(students) {
      if (!students.length) {
        studentTable.innerHTML =
          '<tr><td colspan="7" class="empty-row">No students found.</td></tr>';
        return;
      }

      studentTable.innerHTML = students.map(student => `
        <tr>
          <td>
            ${
              student.profile_pic
                ? `<img
                    class="profile-img"
                    src="${escapeHtml(getProfileUrl(student.profile_pic))}"
                    alt="Profile"
                  >`
                : "No image"
            }
          </td>

          <td>${escapeHtml(student.first_name)}</td>
          <td>${escapeHtml(student.last_name)}</td>
          <td>${escapeHtml(student.email)}</td>
          <td>${escapeHtml(student.phone)}</td>
          <td>${escapeHtml(student.gender)}</td>

          <td>
            <button
              class="action-btn view"
              onclick="viewStudent('${student._id}')"
            >
              View
            </button>

            <button
              class="action-btn edit"
              onclick="editStudent('${student._id}')"
            >
              Edit
            </button>

            <button
              class="action-btn delete"
              onclick="deleteStudent('${student._id}')"
            >
              Delete
            </button>
          </td>
        </tr>
      `).join("");
    }

    // GET SINGLE STUDENT
    async function viewStudent(id) {
      try {
        const res = await fetch(`${apiUrl}/${id}`);

        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }

        const response = await res.json();
        const data = response.student || response.data || response;

        document.getElementById("viewProfilePic").src =
          getProfileUrl(data.profile_pic);

        document.getElementById("viewName").textContent =
          `${data.first_name || ""} ${data.last_name || ""}`.trim();

        document.getElementById("viewEmail").textContent =
          data.email || "";

        document.getElementById("viewPhone").textContent =
          data.phone || "";

        document.getElementById("viewGender").textContent =
          data.gender || "";

        document.getElementById("viewStudentModal").classList.add("show");
      } catch (error) {
        console.error("View Error:", error);
        showMessage("Student details fetch nahi ho paaye.");
      }
    }

    function closeViewModal() {
      document.getElementById("viewStudentModal").classList.remove("show");
    }

    document.getElementById("closeViewModal").addEventListener(
      "click",
      closeViewModal
    );

    document.getElementById("viewStudentModal").addEventListener(
      "click",
      function(e) {
        if (e.target === this) {
          closeViewModal();
        }
      }
    );

    // ADD NEW STUDENT - FRONTEND ROW
    addStudentBtn.addEventListener("click", () => {
      // Prevent adding multiple unsaved rows
      if (document.querySelector("#studentTable .new-student-row")) {
        return;
      }

      const row = document.createElement("tr");
      row.className = "new-student-row";

      row.innerHTML = `
        <td>
          <input
            type="file"
            class="profile-input"
            accept="image/*"
          >
        </td>

        <td>
          <input
            type="text"
            placeholder="First Name"
            class="first-name"
          >
        </td>

        <td>
          <input
            type="text"
            placeholder="Last Name"
            class="last-name"
          >
        </td>

        <td>
          <input
            type="email"
            placeholder="Email"
            class="email"
          >
        </td>

        <td>
          <input
            type="tel"
            placeholder="Phone"
            class="phone"
          >
        </td>

        <td>
          <select class="gender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </td>

        <td>
          <button class="action-btn save" onclick="saveStudent(this)">
            Save
          </button>

          <button class="action-btn cancel" onclick="cancelStudent(this)">
            Cancel
          </button>
        </td>
      `;

      studentTable.prepend(row);
    });

    // POST NEW STUDENT
    async function saveStudent(button) {
      const row = button.closest("tr");

      const profile = row.querySelector(".profile-input").files[0];
      const firstName = row.querySelector(".first-name").value.trim();
      const lastName = row.querySelector(".last-name").value.trim();
      const email = row.querySelector(".email").value.trim();
      const phone = row.querySelector(".phone").value.trim();
      const gender = row.querySelector(".gender").value;

      if (!firstName || !lastName || !email || !phone || !gender) {
        alert("Please fill all fields.");
        return;
      }

      const formData = new FormData();

      // Field names should match your backend multer/controller
      formData.append("first_name", firstName);
      formData.append("last_name", lastName);
      formData.append("email", email);
      formData.append("phone", phone);
      formData.append("gender", gender);

      if (profile) {
        formData.append("profile_pic", profile);
      }

      button.disabled = true;

      try {
        const res = await fetch(apiUrl, {
          method: "POST",
          body: formData
        });

        const result = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(
            result.message || `HTTP Error: ${res.status}`
          );
        }

        row.remove();
        await fetchStudents();
        showMessage("Student successfully added.");
      } catch (error) {
        console.error("Add Error:", error);
        showMessage(error.message || "Student add nahi hua.");
        button.disabled = false;
      }
    }

    function cancelStudent(button) {
      const row = button.closest("tr");
      row.remove();
    }

    // EDIT STUDENT
    async function editStudent(id) {
      try {
        const res = await fetch(`${apiUrl}/${id}`);

        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }

        const response = await res.json();
        const student = response.student || response.data || response;

        const oldRow = [...document.querySelectorAll("#studentTable tr")]
          .find(row =>
            row.querySelector(`[onclick*="editStudent('${id}')"]`)
          );

        if (!oldRow) {
          throw new Error("Student row not found.");
        }

        oldRow.innerHTML = `
          <td>
            <input
              type="file"
              class="profile-input"
              accept="image/*"
            >
            ${
              student.profile_pic
                ? `<small>Current image available</small>`
                : ""
            }
          </td>

          <td>
            <input
              type="text"
              class="edit-first-name"
              value="${escapeHtml(student.first_name)}"
            >
          </td>

          <td>
            <input
              type="text"
              class="edit-last-name"
              value="${escapeHtml(student.last_name)}"
            >
          </td>

          <td>
            <input
              type="email"
              class="edit-email"
              value="${escapeHtml(student.email)}"
            >
          </td>

          <td>
            <input
              type="tel"
              class="edit-phone"
              value="${escapeHtml(student.phone)}"
            >
          </td>

          <td>
            <select class="edit-gender">
              <option value="Male" ${student.gender === "Male" ? "selected" : ""}>
                Male
              </option>
              <option value="Female" ${student.gender === "Female" ? "selected" : ""}>
                Female
              </option>
              <option value="Other" ${student.gender === "Other" ? "selected" : ""}>
                Other
              </option>
            </select>
          </td>

          <td>
            <button
              class="action-btn save"
              onclick="updateStudent(this, '${id}')"
            >
              Update
            </button>

            <button
              class="action-btn cancel"
              onclick="fetchStudents()"
            >
              Cancel
            </button>
          </td>
        `;
      } catch (error) {
        console.error("Edit Error:", error);
        showMessage("Student edit mode open nahi hua.");
      }
    }

    // PUT / UPDATE STUDENT
    async function updateStudent(button, id) {
      const row = button.closest("tr");

      const profile = row.querySelector(".profile-input").files[0];
      const firstName = row.querySelector(".edit-first-name").value.trim();
      const lastName = row.querySelector(".edit-last-name").value.trim();
      const email = row.querySelector(".edit-email").value.trim();
      const phone = row.querySelector(".edit-phone").value.trim();
      const gender = row.querySelector(".edit-gender").value;

      if (!firstName || !lastName || !email || !phone || !gender) {
        alert("Please fill all fields.");
        return;
      }

      const formData = new FormData();

      formData.append("first_name", firstName);
      formData.append("last_name", lastName);
      formData.append("email", email);
      formData.append("phone", phone);
      formData.append("gender", gender);

      if (profile) {
        formData.append("profile_pic", profile);
      }

      button.disabled = true;

      try {
        const res = await fetch(`${apiUrl}/${id}`, {
          method: "PUT",
          body: formData
        });

        const result = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(
            result.message || `HTTP Error: ${res.status}`
          );
        }

        await fetchStudents(searchInput.value);
        showMessage("Student successfully updated.");
      } catch (error) {
        console.error("Update Error:", error);
        showMessage(error.message || "Student update nahi hua.");
        button.disabled = false;
      }
    }

    // DELETE STUDENT
    async function deleteStudent(id) {
      const confirmed = confirm(
        "Are you sure you want to delete this student?"
      );

      if (!confirmed) return;

      try {
        const res = await fetch(`${apiUrl}/${id}`, {
          method: "DELETE"
        });

        const result = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(
            result.message || `HTTP Error: ${res.status}`
          );
        }

        await fetchStudents(searchInput.value);
        showMessage("Student successfully deleted.");
      } catch (error) {
        console.error("Delete Error:", error);
        showMessage(error.message || "Student delete nahi hua.");
      }
    }

    // SEARCH
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);

      searchTimer = setTimeout(() => {
        fetchStudents(searchInput.value);
      }, 300);
    });

    // REFRESH
    refreshBtn.addEventListener("click", () => {
      searchInput.value = "";
      fetchStudents();
    });

    // INITIAL LOAD
    fetchStudents();
  </script>
</body>
</html>
